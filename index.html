<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>IronFox</title>
    <meta name="description" content="Registro de treinos simples, escuro e offline. Seus dados ficam no aparelho, com sincronização opcional na conta Google." />
    <meta name="theme-color" content="#0a0b0d" />
    <meta name="color-scheme" content="dark" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IronFox" />
    <link rel="stylesheet" href="./styles.css?v=5.8.3" />
  </head>
  <body>
    <div id="app"></div>
    <noscript>Ative o JavaScript para usar o app de treinos.</noscript>
    <script>
      window.addEventListener("error", function (event) {
        var app = document.getElementById("app");
        if (app && app.childElementCount === 0) {
          app.style.padding = "24px";
          app.textContent =
            "Não foi possível carregar o app. Recarregue a página. (" +
            (event.message || "erro de carregamento") +
            ")";
        }
      });
    </script>
    <script type="module" src="./src/app.js?v=5.8.3"></script>
  </body>
</html>
